name: "Validate Instructions"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify expected files exist
        run: |
          echo "=== Checking required instruction files ==="
          missing=0
          for f in \
            CLAUDE.md \
            CLAUDE.project.md.template \
            README.md \
            .github/copilot-instructions.md \
            .github/workflows/copilot-setup-steps.yml \
            .github/agents/dev-loop.agent.md \
            .github/agents/code-review.agent.md \
            .github/agents/plan.agent.md \
            .github/agents/instructions.agent.md \
            .github/agents/prd.agent.md \
            .github/instructions/copilot-coding-agent.instructions.md \
            .github/instructions/csharp.instructions.md \
            .github/instructions/powershell.instructions.md \
            .github/instructions/tdd.instructions.md \
            .github/instructions/typescript.instructions.md \
            .github/instructions/project.instructions.md.template \
            .claude/settings.json \
            .claude/hooks/session-start.sh; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required file(s) missing"
            exit 1
          fi
          echo "All required files present."

      - name: Verify every skill has a SKILL.md
        run: |
          echo "=== Checking .github/skills/*/SKILL.md ==="
          if [ ! -d .github/skills ]; then
            echo "No .github/skills directory; skipping."
            exit 0
          fi
          missing=0
          for d in .github/skills/*/; do
            [ -d "$d" ] || continue
            if [ ! -f "${d}SKILL.md" ]; then
              echo "::error::Skill directory ${d} is missing SKILL.md"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi
          echo "All skill directories have SKILL.md."

      - name: Check for project-specific content leaks
        run: |
          echo "=== Scanning for project-specific content ==="
          # These patterns should NOT appear in upstream-managed instruction files.
          # We scan an explicit ALLOWLIST of upstream-managed files (per the
          # "File Ownership" table in README.md). Consumer-owned files
          # (product-spec.md, CLAUDE.project.md, project.instructions.md,
          # the project's own README, docs/, src/, etc.) are NOT scanned --
          # they are expected to contain project-specific content.
          patterns=(
            'GmailNewsClient'
            'GmailSynthesizer'
            'Gmail API'
            'Azure Function'
            'Azure OpenAI'
            'MimeKit'
            'AngleSharp'
            'SampleEmails'
            'GMAIL_SETUP'
            'sample-appsettings'
            'IntelliTect-Samples'
          )

          # Allowlist of upstream-managed paths. Each entry is either a literal
          # file or a directory whose entire contents (recursively) are scanned.
          # *.template files are excluded everywhere -- they intentionally
          # carry placeholder project names that consumers replace.
          # project.instructions.md is consumer-owned and excluded by basename.
          scan_roots=(
            'CLAUDE.md'
            '.github/copilot-instructions.md'
            '.github/agents'
            '.github/instructions'
            '.github/skills'
            '.github/workflows/copilot-setup-steps.yml'
            '.claude'
          )

          targets=()
          for root in "${scan_roots[@]}"; do
            if [ -f "$root" ]; then
              targets+=("$root")
            elif [ -d "$root" ]; then
              while IFS= read -r -d '' f; do
                targets+=("$f")
              done < <(find "$root" -type f \
                \( -name '*.md' -o -name '*.yml' -o -name '*.json' -o -name '*.sh' \) \
                -not -name '*.template' \
                -not -name 'project.instructions.md' \
                -print0)
            fi
          done

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::Allowlist produced zero files to scan -- likely a repo layout bug."
            exit 1
          fi

          echo "Scanning ${#targets[@]} upstream-managed file(s)."

          found=0
          for pattern in "${patterns[@]}"; do
            matches=$(grep -l -F "$pattern" "${targets[@]}" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "::error::Found '$pattern' in: $matches"
              found=$((found + 1))
            fi
          done

          if [ "$found" -gt 0 ]; then
            echo "::error::$found project-specific pattern(s) found. These instructions must be generic."
            exit 1
          fi
          echo "No project-specific content detected."

      - name: Verify warning banners present
        run: |
          echo "=== Checking warning banners ==="
          errors=0

          if ! grep -q "no project-specific content" CLAUDE.md; then
            echo "::error::CLAUDE.md is missing the 'no project-specific content' warning banner"
            errors=$((errors + 1))
          fi

          if ! grep -q "no project-specific content" .github/copilot-instructions.md; then
            echo "::error::copilot-instructions.md is missing the 'no project-specific content' warning banner"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          echo "Warning banners present."

      - name: Validate internal cross-references
        run: |
          echo "=== Checking internal file references ==="
          errors=0

          # Extract referenced file paths from markdown links and check they exist
          # Pattern: [text](./path) or [text](path) for local files
          for md_file in $(find . -name '*.md' -not -path './.git/*'); do
            # Match markdown links to local files (not URLs, not anchors)
            refs=$(grep -oP '\]\(\./[^)#]+\)' "$md_file" | sed 's/\](\.\///' | sed 's/)//' || true)
            dir=$(dirname "$md_file")
            for ref in $refs; do
              target="$dir/$ref"
              if [ ! -e "$target" ] && [ ! -d "$target" ]; then
                echo "::warning::Broken reference in $md_file: ./$ref"
                errors=$((errors + 1))
              fi
            done
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors broken internal reference(s) found"
            exit 1
          fi
          echo "All internal references valid."

      - name: Verify agent files have required frontmatter
        run: |
          echo "=== Checking agent frontmatter ==="
          errors=0

          for agent in .github/agents/*.agent.md; do
            if ! head -1 "$agent" | tr -d '\r' | grep -q '^---$'; then
              echo "::error::$agent is missing YAML frontmatter"
              errors=$((errors + 1))
              continue
            fi
            if ! grep -q '^name:' "$agent"; then
              echo "::error::$agent frontmatter is missing 'name' field"
              errors=$((errors + 1))
            fi
            if ! grep -q '^description:' "$agent"; then
              echo "::error::$agent frontmatter is missing 'description' field"
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          echo "All agent files have valid frontmatter."

  pester:
    name: Pester tests (.github/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # .NET is optional. Agent-e2e dotnet build/test It blocks gracefully
      # skip when the SDK is absent; we install it here so CI exercises the
      # full pipeline (build + test) on the emitted wrapper project.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run Pester suite
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-Pester -Path ./.github -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
